name: build

# PRs: build + upload the APK as an artifact.
# main: build + publish a GitHub release v1.0.<run>, which Obtainium picks up.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "::warning::KEYSTORE_B64 not set; signing with a throwaway key (won't upgrade existing installs)"
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ghost-radar-${{ env.VERSION_NAME }}
          path: ghost-radar.apk

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" ghost-radar.apk \
            --target "$GITHUB_SHA" --title "Ghost Radar $VERSION_NAME" --generate-notes
